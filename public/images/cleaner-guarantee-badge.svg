<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle with gradient -->
  <circle cx="200" cy="200" r="190" fill="url(#goldGradient)" stroke="#E5B45B" stroke-width="4"/>
  
  <!-- Inner circle with lighter gradient -->
  <circle cx="200" cy="200" r="170" fill="url(#innerGradient)" stroke="#E5B45B" stroke-width="2"/>
  
  <!-- Host Hero Logo -->
  <circle cx="200" cy="160" r="40" fill="#14B8A6"/>
  <path d="M180 160a20 20 0 1 0 40 0a20 20 0 1 0 -40 0" stroke="white" stroke-width="4"/>
  
  <!-- Text "CLEANER" -->
  <text x="200" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#8B6B43">CLEANER</text>
  
  <!-- Text "GUARANTEE" -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#8B6B43">GUARANTEE</text>
  
  <!-- Stars -->
  <g transform="translate(200 200)">
    <g transform="rotate(0)">
      <path d="M0,-160 L4,-150 L15,-150 L6,-144 L10,-134 L0,-140 L-10,-134 L-6,-144 L-15,-150 L-4,-150 Z" fill="#FFD700"/>
    </g>
    <g transform="rotate(72)">
      <path d="M0,-160 L4,-150 L15,-150 L6,-144 L10,-134 L0,-140 L-10,-134 L-6,-144 L-15,-150 L-4,-150 Z" fill="#FFD700"/>
    </g>
    <g transform="rotate(144)">
      <path d="M0,-160 L4,-150 L15,-150 L6,-144 L10,-134 L0,-140 L-10,-134 L-6,-144 L-15,-150 L-4,-150 Z" fill="#FFD700"/>
    </g>
    <g transform="rotate(216)">
      <path d="M0,-160 L4,-150 L15,-150 L6,-144 L10,-134 L0,-140 L-10,-134 L-6,-144 L-15,-150 L-4,-150 Z" fill="#FFD700"/>
    </g>
    <g transform="rotate(288)">
      <path d="M0,-160 L4,-150 L15,-150 L6,-144 L10,-134 L0,-140 L-10,-134 L-6,-144 L-15,-150 L-4,-150 Z" fill="#FFD700"/>
    </g>
  </g>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FDB931"/>
      <stop offset="100%" style="stop-color:#E5B45B"/>
    </linearGradient>
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF5D4"/>
      <stop offset="100%" style="stop-color:#FFE5A3"/>
    </linearGradient>
  </defs>
</svg> 