<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="500" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone frame -->
  <rect x="100" y="50" width="200" height="400" rx="20" fill="#ffffff" stroke="#E5E7EB" stroke-width="2"/>
  <!-- Credit card -->
  <rect x="50" y="150" width="300" height="180" rx="15" fill="#14B8A6"/>
  <!-- Card details -->
  <rect x="80" y="200" width="40" height="40" fill="#ffffff" opacity="0.2"/>
  <rect x="80" y="260" width="120" height="8" rx="4" fill="#ffffff"/>
