<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#F9FAFB"/>
  
  <!-- Search Bar -->
  <rect x="100" y="50" width="600" height="60" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
  <circle cx="140" cy="80" r="20" stroke="#14B8A6" stroke-width="3"/>
  <line x1="155" y1="95" x2="170" y2="110" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="90" font-family="Arial, sans-serif" font-size="16" fill="#9CA3AF">Cerca un cleaner nella tua zona...</text>
  
  <!-- Cleaner Cards -->
  <g transform="translate(100 150)">
    <!-- Card 1 -->
    <rect width="180" height="240" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
    <circle cx="90" cy="60" r="40" fill="#14B8A6"/>
    <text x="90" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">Maria R.</text>
    <text x="90" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Milano</text>
    <text x="90" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">⭐️ 4.9 (127)</text>
  </g>
  
  <g transform="translate(310 150)">
    <!-- Card 2 -->
    <rect width="180" height="240" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
    <circle cx="90" cy="60" r="40" fill="#14B8A6"/>
    <text x="90" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">Marco B.</text>
    <text x="90" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Roma</text>
    <text x="90" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">⭐️ 4.8 (93)</text>
  </g>
  
  <g transform="translate(520 150)">
    <!-- Card 3 -->
    <rect width="180" height="240" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
    <circle cx="90" cy="60" r="40" fill="#14B8A6"/>
    <text x="90" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">Laura T.</text>
    <text x="90" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Firenze</text>
    <text x="90" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">⭐️ 5.0 (84)</text>
  </g>
  
  <!-- Filters -->
  <rect x="100" y="420" width="600" height="60" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
  <text x="130" y="458" font-family="Arial, sans-serif" font-size="16" fill="#111827">Filtri:</text>
  
  <!-- Filter Pills -->
  <g transform="translate(200 430)">
    <rect width="100" height="40" rx="20" fill="#F3F4F6"/>
    <text x="50" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4B5563">Disponibilità</text>
  </g>
  
  <g transform="translate(320 430)">
    <rect width="80" height="40" rx="20" fill="#F3F4F6"/>
    <text x="40" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4B5563">Rating</text>
  </g>
  
  <g transform="translate(420 430)">
    <rect width="90" height="40" rx="20" fill="#F3F4F6"/>
    <text x="45" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4B5563">Distanza</text>
  </g>
</svg> 